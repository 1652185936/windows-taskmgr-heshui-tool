<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WaterBar Overlay</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; transition: filter 0.6s ease, opacity 0.6s ease; }
    body.paused canvas { filter: saturate(0.2) brightness(0.85); opacity: 0.65; }
    body.clickable { cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="bar"></canvas>
  <script type="module" src="overlay.js"></script>
</body>
</html>
